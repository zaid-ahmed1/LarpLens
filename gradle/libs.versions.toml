[versions]
agp = "8.11.1"
kotlin = "2.2.21"
activityCompose = "1.13.0"
composeBom = "2026.05.01"
mwdat = "1.0.1"
lifecycle = "2.10.0"
junit = "4.13.2"
mlkitText = "16.0.1"
anthropic = "3.3.0"
opencv = "4.12.0"
opencvDesktop = "4.9.0-0"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
mwdat-core = { group = "com.meta.wearable", name = "mwdat-core", version.ref = "mwdat" }
mwdat-camera = { group = "com.meta.wearable", name = "mwdat-camera", version.ref = "mwdat" }
mwdat-mockdevice = { group = "com.meta.wearable", name = "mwdat-mockdevice", version.ref = "mwdat" }
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitText" }
anthropic-java = { group = "com.anthropic", name = "anthropic-java", version.ref = "anthropic" }
opencv = { group = "org.opencv", name = "opencv", version.ref = "opencv" }
# Desktop build of the same OpenCV version (with macOS/Linux/Windows natives) for JVM unit tests
opencv-desktop = { group = "org.openpnp", name = "opencv", version.ref = "opencvDesktop" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
